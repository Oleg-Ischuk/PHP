<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <h1>Notes App</h1>

    <div class="form-container">
        <h2 id="form-title">Add New Note</h2>
        <form id="note-form">
            <input type="hidden" id="note-id">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" required>
                <div class="error" id="title-error"></div>
            </div>
            <div class="form-group">
                <label for="content">Content</label>
                <textarea id="content" name="content" rows="4" required></textarea>
                <div class="error" id="content-error"></div>
            </div>
            <div class="form-buttons">
                <button type="submit" id="save-btn">Save Note</button>
                <button type="button" id="cancel-btn" style="display: none;">Cancel</button>
            </div>
        </form>
    </div>

    <div class="notes-container">
        <h2>Your Notes</h2>
        <div id="notes-list"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
